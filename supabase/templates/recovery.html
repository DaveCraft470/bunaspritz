<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a1a1a;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Resetează-ți parola</h2>
  <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #444;">
    Ai cerut resetarea parolei pentru contul tău Spritz. Introdu codul de mai jos în aplicație pentru a continua.
  </p>
  <div style="text-align: center; margin: 28px 0;">
    <span style="display: inline-block; font-size: 32px; font-weight: 700; letter-spacing: 8px; padding: 14px 24px; background: #F0FBF4; color: #16A34A; border-radius: 12px;">
      {{ .Token }}
    </span>
  </div>
  <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #888;">
    Codul expiră în scurt timp. Dacă nu ai cerut resetarea parolei, poți ignora acest email — parola ta rămâne neschimbată.
  </p>
</div>
